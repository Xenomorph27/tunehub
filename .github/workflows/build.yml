name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# queue builds instead of cancelling one halfway through publishing
concurrency:
  group: build
  cancel-in-progress: false

env:
  # SHA-256 of the certificate every published TuneHub APK is signed with. A build signed with
  # anything else could not update existing installs, so it must never be published.
  RELEASE_CERT_SHA256: 81c410657500b1baaa34c033b39e0a30d0f2adc053e1fcd75354848c415eb2c4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Version codes must always rise, or phones refuse the update. Numbering continues from the
      # "TuneHub build 27" release; the guard below also checks against the newest published build.
      - name: Set build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 15 ))
          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("build-")) | ltrimstr("build-") | tonumber] | max // 0')
          echo "This build: $BUILD_NUMBER, newest published: $LATEST"
          if [ "$BUILD_NUMBER" -le "$LATEST" ]; then
            echo "::error::Build number $BUILD_NUMBER is not higher than published build $LATEST"
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # fail closed: never fall back to a throwaway debug key for a published build
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Signing secret $v is missing"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tunehub.jks"
          echo "TUNEHUB_KEYSTORE=$RUNNER_TEMP/tunehub.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          TUNEHUB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUNEHUB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUNEHUB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify the APK is signed with the release certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "Signed with: $CERT"
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK certificate $CERT does not match the release certificate"
            exit 1
          fi

      # Deterministic tests (no network): these must pass before anything is published
      - name: Unit tests
        run: gradle testReleaseUnitTest --tests "com.tunehub.app.unit.*"

      # Talks to the real YouTube; datacenter IPs get blocked sometimes, so this one only warns
      - name: Live YouTube smoke test (advisory)
        continue-on-error: true
        run: gradle testReleaseUnitTest --tests "com.tunehub.app.ExtractionTest"

      - uses: actions/upload-artifact@v4
        with:
          name: tunehub-apk
          path: app/build/outputs/apk/release/*.apk

      # One release per build, never deleted, so GitHub's download counts add up across builds.
      # Only from main; a re-run of an already published build stops here instead of failing later.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$BUILD_NUMBER"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing it"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk tunehub.apk
          gh release create "$TAG" tunehub.apk \
            --repo "${{ github.repository }}" \
            --title "TuneHub build $BUILD_NUMBER" \
            --notes "Download **tunehub.apk** below and open it on your Android phone. It installs over older versions and keeps your library." \
            --target "${{ github.sha }}" \
            --latest
