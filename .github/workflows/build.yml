name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spitify.jks"
            echo "SPITIFY_KEYSTORE=$RUNNER_TEMP/spitify.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret; APK is signed with a throwaway debug key"
          fi

      - name: Build release APK
        env:
          SPITIFY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPITIFY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPITIFY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # Talks to the real YouTube; datacenter IPs get blocked sometimes, so don't fail the build
      - name: YouTube extraction smoke test
        continue-on-error: true
        run: gradle testReleaseUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: spitify-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk spitify.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest spitify.apk \
            --title "Spitify build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download spitify.apk on your phone and install it." \
            --target "${{ github.sha }}"
