name: UI check (emulator)

# Manual only: an emulator run takes ~15 minutes of CI time
on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # the release build, because R8 is where reflection-heavy code (the extractor) can break
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tunehub.jks"
            echo "TUNEHUB_KEYSTORE=$RUNNER_TEMP/tunehub.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          TUNEHUB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUNEHUB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUNEHUB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Unit tests
        run: gradle testReleaseUnitTest --tests "com.tunehub.app.unit.*"

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 900
          script: bash ci/ui-check.sh app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
